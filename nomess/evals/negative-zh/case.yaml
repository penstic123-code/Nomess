schema_version: "1.0"
name: negative-zh
description: "zh prompt that should not load any nomess skill"
tags: [zh, negative]
execution:
  prompt: |
    把这句话翻译成英文：今天天气很好，我们去公园散步吧。
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: no-nomess-skill
    tool: Skill
    input_match: "nomess"
    max: 0
