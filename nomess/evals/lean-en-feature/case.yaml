schema_version: "1.0"
name: lean-en-feature
description: "en prompt that should load the nomess lean-change skill"
tags: [en, lean-change]
execution:
  prompt: |
    Add a `retry` decorator to this module so `fetch` is retried up to 3 times on ConnectionError, with a short sleep between tries. Reply with the changed code.

    ```python
    import time
    import urllib.request

    def fetch(url):
        with urllib.request.urlopen(url, timeout=5) as r:
            return r.read()
    ```
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-lean-change
    tool: Skill
    input_match: "lean-change"
    min: 1
  - type: regex
    name: tests-line
    target: last_message
    pattern: "Tests:|测试："
    match: contains
