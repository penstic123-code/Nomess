schema_version: "1.0"
name: lean-zh-feature
description: "zh prompt that should load the nomess lean-change skill"
tags: [zh, lean-change]
execution:
  prompt: |
    给下面这个函数加一个功能：支持传入 `ignore_case=True` 时忽略大小写去重，保持原来的顺序。直接回复改好的代码。

    ```python
    def dedupe(items):
        seen = set()
        out = []
        for x in items:
            if x not in seen:
                seen.add(x)
                out.append(x)
        return out
    ```
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-lean-change
    tool: Skill
    input_match: "lean-change"
    min: 1
  - type: regex
    name: tests-line
    target: last_message
    pattern: "Tests:|测试："
    match: contains
