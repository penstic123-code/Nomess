schema_version: "1.0"
name: lean-en-bugfix
description: "en prompt that should load the nomess lean-change skill"
tags: [en, lean-change]
execution:
  prompt: |
    This function sometimes returns the wrong average; fix it and reply with the fixed code.

    ```python
    def average(values):
        total = 0
        for i in range(1, len(values)):
            total += values[i]
        return total / len(values)
    ```
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-lean-change
    tool: Skill
    input_match: "lean-change"
    min: 1
  - type: regex
    name: tests-line
    target: last_message
    pattern: "Tests:|测试："
    match: contains
