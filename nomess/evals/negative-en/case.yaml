schema_version: "1.0"
name: negative-en
description: "en prompt that should not load any nomess skill"
tags: [en, negative]
execution:
  prompt: |
    In two sentences: what is the difference between TCP and UDP?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: no-nomess-skill
    tool: Skill
    input_match: "nomess"
    max: 0
